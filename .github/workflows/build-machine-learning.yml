name: Build Machine Learning submission package
on:
  push:
    branches: [submission/machine-learning-2026]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc curl texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-publishers latexmk poppler-utils
      - name: Build manuscript
        shell: bash
        run: |
          set -euo pipefail
          root=publication/representation_predictive_uncertainty
          mkdir -p submission
          cp "$root"/generated/figure_{1_replication_forest,2_condition_profile,3_intervention_forest,4_c4_equivalence}.png submission/
          cp "$root"/MANUSCRIPT_MLJ_ADAPTED_EN.md submission/manuscript.md
          curl -fsSL --retry 3 https://raw.githubusercontent.com/DanySK/template-latex-springer-nature-sn-jnl/master/sn-jnl.cls -o submission/sn-jnl.cls
          python3 - <<'PY'
          from pathlib import Path
          p=Path('submission/manuscript.md')
          s=p.read_text()
          s=s.replace('(generated/figure_','(figure_')
          s=s.replace(r'\[','$$').replace(r'\]','$$')
          s=s.replace('# Representation-Dependent Predictive Uncertainty in Autoregressive Language Models\n','',1)
          s=s.replace('**Yedil Nurakhov**  \nDepartment of Computer Science, Al-Farabi Kazakh National University, Almaty, Kazakhstan  \nEmail: y.nurakhov@gmail.com  \nORCID: 0000-0003-0799-7555\n','',1)
          p.write_text(s)
          PY
          pandoc submission/manuscript.md -f markdown+tex_math_dollars+raw_tex -t latex --standalone --metadata title='Representation-Dependent Predictive Uncertainty in Autoregressive Language Models' --metadata author='Yedil Nurakhov' --metadata date='' -V fontsize=10pt -o submission/main.tex
          cd submission
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('main.tex')
          s=p.read_text()
          s=re.sub(r'\\documentclass(?:\[[^\]]*\])?\{article\}', lambda m:r'\documentclass[sn-basic]{sn-jnl}',s,count=1)
          s=re.sub(r'\\usepackage(?:\[[^\]]*\])?\{geometry\}', '', s)
          s=re.sub(r'\\geometry\{[^}]+\}', '', s)
          # Compatibility with older sn-jnl class shipout hooks under TeX Live.
          s=s.replace(r'\\begin{document}',r'\\makeatletter\\providecommand{\\headerps@out}[1]{}\\makeatother'+'\n'+r'\\begin{document}',1)
          s=re.sub(r'\\author\{Yedil Nurakhov\}',lambda m:r'\author*[1]{\fnm{Yedil} \sur{Nurakhov}}\email{y.nurakhov@gmail.com}'+'\n'+r'\affil*[1]{\orgdiv{Department of Computer Science}, \orgname{Al-Farabi Kazakh National University}, \orgaddress{\city{Almaty}, \country{Kazakhstan}}}',s,count=1)
          s=re.sub(r'\\hypertarget\{abstract\}\{%[\s\S]*?\\label\{abstract\}\}',lambda m:r'\begin{abstract}',s,count=1)
          s=s.replace(r'\hypertarget{introduction}',r'\end{abstract}'+'\n'+r'\keywords{autoregressive language models, predictive entropy, representation dependence, teacher forcing, code and natural language}'+'\n'+r'\hypertarget{introduction}',1)
          s=s.replace(r'\begin{figure}',r'\begin{figure}[!htbp]\centering')
          s=re.sub(r'\\includegraphics\{(figure_[^}]+)\}',lambda m:r'\includegraphics[width=0.74\linewidth]{'+m.group(1)+'}',s)
          p.write_text(s)
          PY
          latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex
          pdfinfo main.pdf | grep Pages
      - name: Upload built files
        uses: actions/upload-artifact@v4
        with:
          name: machine-learning-springer-layout
          path: submission/
          if-no-files-found: error
