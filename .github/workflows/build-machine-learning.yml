name: Build Machine Learning submission package
on:
  push:
    branches: [submission/machine-learning-2026]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-publishers latexmk poppler-utils
      - name: Build PDF and flat submission sources
        shell: bash
        run: |
          set -euo pipefail
          root=publication/representation_predictive_uncertainty
          mkdir -p submission
          cp "$root"/generated/figure_{1_replication_forest,2_condition_profile,3_intervention_forest,4_c4_equivalence}.png submission/
          cp "$root"/MLJ_SUBMISSION_SOURCE/main.tex submission/main-springer-draft.tex
          curl -fsSL --retry 3 https://raw.githubusercontent.com/DanySK/template-latex-springer-nature-sn-jnl/master/sn-jnl.cls -o submission/sn-jnl.cls
          cp "$root"/MANUSCRIPT_MLJ_ADAPTED_EN.md submission/manuscript.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('submission/manuscript.md')
          text=p.read_text()
          text=text.replace('(generated/figure_', '(figure_')
          # Convert original display-math delimiters to Pandoc-supported math blocks.
          text=text.replace(r'\[', '$$').replace(r'\]', '$$')
          # Markdown author metadata is supplied to pandoc explicitly.
          text=text.replace('# Representation-Dependent Predictive Uncertainty in Autoregressive Language Models\n','',1)
          text=text.replace('**Yedil Nurakhov**  \nDepartment of Computer Science, Al-Farabi Kazakh National University, Almaty, Kazakhstan  \nEmail: y.nurakhov@gmail.com  \nORCID: 0000-0003-0799-7555\n','',1)
          p.write_text(text)
          PY
          pandoc submission/manuscript.md -f markdown+tex_math_dollars+raw_tex -t latex --standalone \
            --metadata title='Representation-Dependent Predictive Uncertainty in Autoregressive Language Models' \
            --metadata author='Yedil Nurakhov' \
            --metadata date='' \
            -V geometry:margin=1in -V fontsize=10pt -V colorlinks=true \
            -o submission/main.tex
          cd submission
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('main.tex')
          t=p.read_text()
          # Rewrite the Pandoc document into the journal's actual sn-jnl class.
          t=re.sub(r'\\documentclass(?:\[[^]]*\])?\{article\}',r'\\documentclass[sn-basic]{sn-jnl}',t,count=1)
          t=re.sub(r'^\\\\usepackage(?:\\[[^]]*\\])?\\{geometry\\}\\s*
          t=re.sub(r'\\author\{Yedil Nurakhov\}',r'\\author*[1]{\\fnm{Yedil} \\sur{Nurakhov}}\\email{y.nurakhov@gmail.com}\\affil*[1]{\\orgdiv{Department of Computer Science}, \\orgname{Al-Farabi Kazakh National University}, \\orgaddress{\\city{Almaty}, \\country{Kazakhstan}}}',t,count=1)
          t=t.replace('\\begin{document}\n\\maketitle','\\begin{document}\n\\maketitle')
          # The heading is an original Markdown heading rather than a real abstract.
          t=re.sub(r'\\hypertarget\{abstract\}\{%\s*\\subsection\{Abstract\}\\label\{abstract\}\}',r'\\begin{abstract}',t,count=1)
          t=re.sub(r'\\hypertarget\{introduction\}',r'\\end{abstract}\n\\keywords{autoregressive language models, predictive entropy, representation dependence, teacher forcing, code and natural language}\n\\hypertarget{introduction}',t,count=1)
          # Give smaller figures space to flow with neighboring prose.
          t=t.replace('\\begin{figure}', '\\begin{figure}[!htbp]\\centering')
          t=re.sub(r'\\includegraphics\{(figure_[^}]+)\}',r'\\includegraphics[width=0.77\\linewidth]{\1}',t)
          t=t.replace('\\begin{longtable}', '\\begin{longtable}')
          p.write_text(t)
          PY
          latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex
          pdfinfo main.pdf | head -20
          pdftotext main.pdf extracted.txt
          for item in '0.3605' '0.6592' '0.6353' '0.1835' '0.3730' '−0.0058'; do
            if ! grep -Fq "$item" extracted.txt; then echo "Text extraction check: $item not found"; fi
          done
          rm -f *.aux *.log *.fls *.fdb_latexmk *.xdv *.out extracted.txt
      - name: Upload compiled submission package
        uses: actions/upload-artifact@v4
        with:
          name: machine-learning-submission-draft
          path: submission/
          if-no-files-found: error
, '', t, flags=re.MULTILINE)
          t=re.sub(r'^\\\\geometry\\{[^}]*\\}\\s*
          t=re.sub(r'\\author\{Yedil Nurakhov\}',r'\\author*[1]{\\fnm{Yedil} \\sur{Nurakhov}}\\email{y.nurakhov@gmail.com}\\affil*[1]{\\orgdiv{Department of Computer Science}, \\orgname{Al-Farabi Kazakh National University}, \\orgaddress{\\city{Almaty}, \\country{Kazakhstan}}}',t,count=1)
          t=t.replace('\\begin{document}\n\\maketitle','\\begin{document}\n\\maketitle')
          # The heading is an original Markdown heading rather than a real abstract.
          t=re.sub(r'\\hypertarget\{abstract\}\{%\s*\\subsection\{Abstract\}\\label\{abstract\}\}',r'\\begin{abstract}',t,count=1)
          t=re.sub(r'\\hypertarget\{introduction\}',r'\\end{abstract}\n\\keywords{autoregressive language models, predictive entropy, representation dependence, teacher forcing, code and natural language}\n\\hypertarget{introduction}',t,count=1)
          # Give smaller figures space to flow with neighboring prose.
          t=t.replace('\\begin{figure}', '\\begin{figure}[!htbp]\\centering')
          t=re.sub(r'\\includegraphics\{(figure_[^}]+)\}',r'\\includegraphics[width=0.77\\linewidth]{\1}',t)
          t=t.replace('\\begin{longtable}', '\\begin{longtable}')
          p.write_text(t)
          PY
          latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex
          pdfinfo main.pdf | head -20
          pdftotext main.pdf extracted.txt
          for item in '0.3605' '0.6592' '0.6353' '0.1835' '0.3730' '−0.0058'; do
            if ! grep -Fq "$item" extracted.txt; then echo "Text extraction check: $item not found"; fi
          done
          rm -f *.aux *.log *.fls *.fdb_latexmk *.xdv *.out extracted.txt
      - name: Upload compiled submission package
        uses: actions/upload-artifact@v4
        with:
          name: machine-learning-submission-draft
          path: submission/
          if-no-files-found: error
, '', t, flags=re.MULTILINE)
          t=re.sub(r'\\author\{Yedil Nurakhov\}',r'\\author*[1]{\\fnm{Yedil} \\sur{Nurakhov}}\\email{y.nurakhov@gmail.com}\\affil*[1]{\\orgdiv{Department of Computer Science}, \\orgname{Al-Farabi Kazakh National University}, \\orgaddress{\\city{Almaty}, \\country{Kazakhstan}}}',t,count=1)
          t=t.replace('\\begin{document}\n\\maketitle','\\begin{document}\n\\maketitle')
          # The heading is an original Markdown heading rather than a real abstract.
          t=re.sub(r'\\hypertarget\{abstract\}\{%\s*\\subsection\{Abstract\}\\label\{abstract\}\}',r'\\begin{abstract}',t,count=1)
          t=re.sub(r'\\hypertarget\{introduction\}',r'\\end{abstract}\n\\keywords{autoregressive language models, predictive entropy, representation dependence, teacher forcing, code and natural language}\n\\hypertarget{introduction}',t,count=1)
          # Give smaller figures space to flow with neighboring prose.
          t=t.replace('\\begin{figure}', '\\begin{figure}[!htbp]\\centering')
          t=re.sub(r'\\includegraphics\{(figure_[^}]+)\}',r'\\includegraphics[width=0.77\\linewidth]{\1}',t)
          t=t.replace('\\begin{longtable}', '\\begin{longtable}')
          p.write_text(t)
          PY
          latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex
          pdfinfo main.pdf | head -20
          pdftotext main.pdf extracted.txt
          for item in '0.3605' '0.6592' '0.6353' '0.1835' '0.3730' '−0.0058'; do
            if ! grep -Fq "$item" extracted.txt; then echo "Text extraction check: $item not found"; fi
          done
          rm -f *.aux *.log *.fls *.fdb_latexmk *.xdv *.out extracted.txt
      - name: Upload compiled submission package
        uses: actions/upload-artifact@v4
        with:
          name: machine-learning-submission-draft
          path: submission/
          if-no-files-found: error
